<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - Eventlyy</title>
    <style>
        :root {
            --brand-color: #0284c7;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0b0f17;
                --text-color: #f1f5f9;
                --card-bg: #151c28;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .offline-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 40px 28px;
            max-width: 440px;
            width: 100%;
        }
        .offline-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(2, 132, 199, 0.12);
            color: var(--brand-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #64748b;
            margin-bottom: 24px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background-color: var(--brand-color);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: transparent;
            color: var(--text-color);
            border: 1.5px solid rgba(148, 163, 184, 0.3);
        }
        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.1);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <h1>You're Currently Offline</h1>
        <p>No internet connection detected. Your saved tickets, admission passes, and previously loaded pages remain available in your cache.</p>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="window.location.reload()">Retry Connection</button>
            <a href="/profile" class="btn btn-secondary">View My Cached Passes</a>
        </div>
    </div>
</body>
</html>
